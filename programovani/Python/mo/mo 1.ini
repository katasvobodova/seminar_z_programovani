def generate_two_digit_numbers():
    # Devítimístné číslo s číslicemi 1 až 9 (každá číslice jednou)
    number = "123456789"
    
    # Vytvoříme seznam dvoumístných čísel z po sobě jdoucích dvojic číslic
    two_digit_numbers = [int(number[i:i+2]) for i in range(len(number) - 1)]
    
    # Vypíšeme jednotlivá dvoumístná čísla
    for num in two_digit_numbers:
        print(num)

generate_two_digit_numbers()